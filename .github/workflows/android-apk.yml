name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      diagnose_google:
        description: "Controlla la registrazione Firebase dell'accesso Google (stampa un riepilogo, senza segreti)"
        type: boolean
        default: false
      publish_site:
        description: 'Pubblica anche il sito ufficiale con questo APK (da main parte da solo)'
        type: boolean
        default: false
  push:
    branches: [main]

env:
  PROJECT: gen-lang-client-0532460534
  PACKAGE: com.checucinooggi.mealplanner

jobs:
  diagnose-google:
    if: inputs.diagnose_google
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Riepilogo accesso Google (nessun segreto stampato)
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          echo "== Impronte della chiave di firma nel repository =="
          keytool -list -v -keystore android-signing/debug.keystore -storepass android 2>/dev/null | grep -E "SHA1|SHA256"
          FB="npx --yes firebase-tools@14"
          echo; echo "== App Android registrate =="
          $FB apps:list ANDROID --project "$PROJECT" --json > "$RUNNER_TEMP/apps.json"
          node -e 'const a=(JSON.parse(require("fs").readFileSync(process.argv[1])).result)||[]; a.forEach(x=>console.log(x.appId, x.packageName, x.displayName))' "$RUNNER_TEMP/apps.json"
          APP_ID=$(node -e 'const a=(JSON.parse(require("fs").readFileSync(process.argv[1])).result)||[]; const x=a.find(y=>y.packageName===process.env.PACKAGE); console.log(x?x.appId:"")' "$RUNNER_TEMP/apps.json")
          echo "App usata: $APP_ID"
          echo; echo "== Impronte registrate su Firebase =="
          $FB apps:android:sha:list "$APP_ID" --project "$PROJECT" || true
          echo; echo "== Client OAuth nella configurazione scaricata =="
          $FB apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out "$RUNNER_TEMP/google-services.json" >/dev/null
          node -e '
            const j=JSON.parse(require("fs").readFileSync(process.argv[1]));
            console.log("progetto:", j.project_info.project_id);
            for (const c of j.client) {
              console.log("app:", c.client_info.android_client_info.package_name);
              (c.oauth_client||[]).forEach(o=>console.log(" client_type", o.client_type, o.android_info?("android "+o.android_info.package_name+" sha1:"+o.android_info.certificate_hash):""));
              console.log(" oauth_client totali:", (c.oauth_client||[]).length);
            }' "$RUNNER_TEMP/google-services.json"
          echo; echo "== Provider Google in Firebase Authentication =="
          sudo apt-get install -y -qq jq >/dev/null 2>&1 || true
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" -q >/dev/null 2>&1
          TOKEN=$(gcloud auth print-access-token)
          curl -s -H "Authorization: Bearer $TOKEN" -H "x-goog-user-project: $PROJECT" "https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT/defaultSupportedIdpConfigs/google.com" | jq '{name, enabled, clientId, error: .error.message}'
          rm -f "$RUNNER_TEMP/sa.json"

  apk:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      # Numero di versione (anno.mese.giorno.build): finisce nell'app, nel nome del file e sul sito
      - name: Numero di versione
        run: echo "APP_VERSION=$(date +%Y.%m.%d).${{ github.run_number }}" >> "$GITHUB_ENV"
      - run: npm run build
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      # La cartella android/ non è nel repository: la generiamo ad ogni build
      - run: npx cap add android

      # Firma fissa: stessa impronta a ogni build (aggiornamenti senza disinstallare e accesso Google riconosciuto)
      - name: Chiave di firma fissa
        run: |
          mkdir -p ~/.android
          cp android-signing/debug.keystore ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android 2>/dev/null | grep -E "SHA1|SHA256" | tee "$RUNNER_TEMP/sha.txt"
          echo "SHA1=$(grep 'SHA1:' "$RUNNER_TEMP/sha.txt" | sed 's/.*SHA1: *//')" >> "$GITHUB_ENV"
          echo "SHA256=$(grep 'SHA256:' "$RUNNER_TEMP/sha.txt" | sed 's/.*SHA256: *//')" >> "$GITHUB_ENV"
          # Gradle non usava sempre ~/.android/debug.keystore (l'APK usciva con un'altra firma): la indichiamo in modo esplicito
          KS="$GITHUB_WORKSPACE/android-signing/debug.keystore"
          awk -v ks="$KS" '
            /^android \{/ && !done {
              print
              print "    signingConfigs {"
              print "        debug {"
              print "            storeFile file(\"" ks "\")"
              print "            storePassword \"android\""
              print "            keyAlias \"androiddebugkey\""
              print "            keyPassword \"android\""
              print "        }"
              print "    }"
              done=1; next
            }
            { print }' android/app/build.gradle > "$RUNNER_TEMP/app-build.gradle"
          cp "$RUNNER_TEMP/app-build.gradle" android/app/build.gradle
          grep -n -A8 "signingConfigs" android/app/build.gradle

      # Accesso con Google nell'app: registra l'app Android su Firebase (una volta sola, poi si riconosce) e scarica la configurazione
      - name: Configurazione Firebase per Android
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Manca il secret FIREBASE_SERVICE_ACCOUNT"; exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          FB="npx --yes firebase-tools@14"
          APP_ID=$($FB apps:list ANDROID --project "$PROJECT" --json | node -e '
            let d=""; process.stdin.on("data",c=>d+=c).on("end",()=>{
              const apps=(JSON.parse(d).result)||[];
              const a=apps.find(x=>x.packageName===process.env.PACKAGE);
              console.log(a?a.appId:"");
            });')
          if [ -z "$APP_ID" ]; then
            echo "Registro l'app Android su Firebase"
            $FB apps:create ANDROID "Che cucino oggi" --package-name "$PACKAGE" --project "$PROJECT"
            APP_ID=$($FB apps:list ANDROID --project "$PROJECT" --json | node -e '
              let d=""; process.stdin.on("data",c=>d+=c).on("end",()=>{
                const a=((JSON.parse(d).result)||[]).find(x=>x.packageName===process.env.PACKAGE);
                console.log(a?a.appId:"");
              });')
          fi
          [ -n "$APP_ID" ] || { echo "::error::App Android non trovata su Firebase"; exit 1; }
          echo "App Firebase: $APP_ID"
          for H in "$SHA1" "$SHA256"; do
            $FB apps:android:sha:create "$APP_ID" "$H" --project "$PROJECT" || echo "(impronta già presente)"
          done
          $FB apps:sdkconfig ANDROID "$APP_ID" --project "$PROJECT" --out android/app/google-services.json
          grep -c '"client_type": 3' android/app/google-services.json || true
          rm -f "$RUNNER_TEMP/sa.json"
      # Include la finestra di accesso Google di Android nel plugin
      - name: Abilita Google nel plugin di accesso
        run: |
          sed -i 's/^ext {/ext {\n    rgcfaIncludeGoogle = true/' android/variables.gradle
          grep -n rgcfaIncludeGoogle android/variables.gradle
      # Icona e schermata di avvio dell'app Android dal nostro logo (assets/): se fallisce, la build si ferma
      - run: npx capacitor-assets generate --android
      # Android 13+: serve il permesso per le notifiche (promemoria della domenica)
      - name: Permesso notifiche nel manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS "$MANIFEST" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' "$MANIFEST"
          grep POST_NOTIFICATIONS "$MANIFEST"
      # Versione dell'app: cresce a ogni build, così Android la riconosce come aggiornamento
      - name: Versione dell'app
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$APP_VERSION\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - run: npx cap sync android

      - name: Build APK (debug, installabile senza store)
        working-directory: android
        run: ./gradlew assembleDebug

      # Controllo: la firma reale dell'APK e l'ID client Google che l'app usa davvero (nessun segreto)
      - name: Verifica firma e configurazione Google dell'APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "== Firma dell'APK =="
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "SHA-1|SHA-256"
          REAL=$("$APKSIGNER" verify --print-certs "$APK" | grep "SHA-1 digest" | head -1 | sed 's/.*: *//' | tr -d ':' | tr 'A-Z' 'a-z')
          WANT=$(echo "$SHA1" | tr -d ':' | tr 'A-Z' 'a-z')
          [ "$REAL" = "$WANT" ] || { echo "::error::L'APK è firmato con una chiave diversa da quella registrata su Firebase ($REAL invece di $WANT)"; exit 1; }
          echo "== Attese (chiave nel repository) =="
          echo "SHA-1:   $SHA1"
          echo "SHA-256: $SHA256"
          echo "== default_web_client_id usato dall'app =="
          grep -rn "default_web_client_id\|google_app_id\|gcm_defaultSenderId" android/app/build/generated/res/processDebugGoogleServices/values/values.xml || echo "values.xml non trovato"
          echo "== Plugin Google di Gradle =="
          grep -n "google-services\|rgcfaIncludeGoogle" android/app/build.gradle android/build.gradle android/variables.gradle || true
          echo "== Package e versione =="
          grep -n "applicationId" android/app/build.gradle

      # Il file porta la versione nel nome: si capisce subito quale si sta scaricando
      - name: Nome del file con la versione
        run: |
          mkdir -p apk-out
          cp android/app/build/outputs/apk/debug/app-debug.apk "apk-out/che-cucino-oggi-$APP_VERSION.apk"
          ls -l apk-out

      - uses: actions/upload-artifact@v4
        with:
          name: che-cucino-oggi-${{ env.APP_VERSION }}
          path: apk-out/che-cucino-oggi-${{ env.APP_VERSION }}.apk

      # Sito ufficiale (SEO e download): si aggiorna a ogni build da main, con l'APK appena costruito
      - name: Pubblica il sito ufficiale
        if: github.ref == 'refs/heads/main' || inputs.publish_site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          APP_URL: ${{ vars.APP_URL }}
          APK: apk-out/che-cucino-oggi-${{ env.APP_VERSION }}.apk
          BUILD: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          export SITE_URL="${SITE_URL:-https://che-cucino-oggi.web.app}"
          export APP_URL="${APP_URL:-https://$PROJECT.web.app}"
          npx tsx scripts/build-landing.ts
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          SITE=$(node -p "require('./firebase.landing.json').hosting.site")
          npx --yes firebase-tools@14 hosting:sites:create "$SITE" --project "$PROJECT" || echo "(il sito esiste già)"
          npx --yes firebase-tools@14 deploy --only hosting --config firebase.landing.json --project "$PROJECT"
          rm -f "$RUNNER_TEMP/sa.json"
