name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run build

      # La cartella android/ non è nel repository: la generiamo ad ogni build
      - run: npx cap add android
      # Icona dell'app Android dal nostro logo (assets/); se fallisce l'APK resta valido con l'icona di default
      - run: npx capacitor-assets generate --android
        continue-on-error: true
      - run: npx cap sync android

      - name: Build APK (debug, installabile senza store)
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: che-cucino-oggi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
