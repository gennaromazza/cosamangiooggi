name: Deploy Firebase (sito, regole, funzioni)

on:
  workflow_dispatch:
    inputs:
      diagnose_stripe:
        description: "Controlla la configurazione di Stripe (chiave, prezzi, portale, webhook) senza stampare segreti. Non pubblica niente"
        type: boolean
        default: false
      reset_test_billing:
        description: "Passaggio a Stripe reale: ripulisce i dati di abbonamento nati in prova (anteprima = non modifica niente). Non pubblica il sito"
        type: choice
        options: ['no', 'anteprima', 'applica']
        default: 'no'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
      - 'package.json'
      - '.github/workflows/deploy-firebase.yml'

env:
  PROJECT: gen-lang-client-0532460534

jobs:
  diagnose-stripe:
    if: ${{ inputs.diagnose_stripe }}
    runs-on: ubuntu-latest
    env:
      KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      PRICE_SMART: ${{ vars.PRICE_SMART }}
      PRICE_SMART_YEAR: ${{ vars.PRICE_SMART_YEAR }}
      PRICE_PRO: ${{ vars.PRICE_PRO }}
      PRICE_PRO_YEAR: ${{ vars.PRICE_PRO_YEAR }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Riepilogo Stripe (nessun segreto stampato)
        run: |
          [ -n "$KEY" ] || { echo "::error::Manca il secret STRIPE_SECRET_KEY"; exit 1; }
          api() { curl -s -u "$KEY:" "https://api.stripe.com/v1/$1"; }
          MODE=TEST; case "$KEY" in sk_live_*|rk_live_*|pk_live_*) MODE=LIVE;; esac
          case "$KEY" in
            sk_*|rk_*) echo "== Chiave: segreta, modalità $MODE ==" ;;
            *) echo "::error::La chiave salvata inizia con ${KEY:0:3}: non è una chiave SEGRETA. Serve quella che inizia con sk_live_"; exit 1 ;;
          esac
          echo "== Account =="
          api account | jq '{charges_enabled, details_submitted, country, disabled_reason: .requirements.disabled_reason, da_completare: (.requirements.currently_due // [] | length), error: .error.message}'
          echo "== Prezzi (devono essere della stessa modalità della chiave) =="
          for NAME in PRICE_SMART PRICE_SMART_YEAR PRICE_PRO PRICE_PRO_YEAR; do
            ID="${!NAME}"
            echo "$NAME → ${ID:0:12}…"
            api "prices/$ID" | jq -c '{livemode, active, currency, unit_amount, intervallo: .recurring.interval, error: .error.message}'
          done
          echo "== Portale clienti =="
          api "billing_portal/configurations?limit=5" | jq -c '{configurazioni: (.data | length), attive: [.data[] | select(.active) | {predefinita: .is_default, livemode}], error: .error.message}'
          echo "== Webhook =="
          api "webhook_endpoints?limit=10" | jq -c '[.data[] | {url, status, livemode, eventi: (.enabled_events | length)}]'
          echo "== Prova di pagamento (la sessione si chiude subito, non addebita nulla) =="
          R=$(curl -s -u "$KEY:" https://api.stripe.com/v1/checkout/sessions -d mode=subscription -d "line_items[0][price]=$PRICE_SMART" -d "line_items[0][quantity]=1" -d "success_url=$APP_URL/?checkout=success" -d "cancel_url=$APP_URL/?checkout=cancel" -d "subscription_data[trial_period_days]=7" -d locale=it)
          echo "$R" | jq -c '{creata: (.id != null), modalita: .mode, livemode, errore: .error.message, codice: .error.code, parametro: .error.param}'
          SID=$(echo "$R" | jq -r '.id // empty')
          [ -z "$SID" ] || curl -s -u "$KEY:" -X POST "https://api.stripe.com/v1/checkout/sessions/$SID/expire" -o /dev/null

  reset-billing:
    if: ${{ inputs.reset_test_billing == 'anteprima' || inputs.reset_test_billing == 'applica' }}
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix functions
      - name: Ripulisci i dati di abbonamento di prova
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          if [ "${{ inputs.reset_test_billing }}" = "applica" ]; then node scripts/reset-test-billing.cjs --apply; else node scripts/reset-test-billing.cjs; fi
          rm -f "$RUNNER_TEMP/sa.json"

  deploy:
    if: ${{ !(inputs.reset_test_billing == 'anteprima' || inputs.reset_test_billing == 'applica' || inputs.diagnose_stripe) }}
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Verifica credenziali
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Manca il secret FIREBASE_SERVICE_ACCOUNT (deve essere un 'Repository secret', non un 'Environment secret')."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      # Regole di sicurezza e funzioni del menù condiviso, provate contro l'emulatore di Firestore (serve Java)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix functions
      - run: npm run test:rules
        timeout-minutes: 10
      - run: npm run build

      - name: Credenziali Firebase
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          node -e '
            let j;
            try { j = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); }
            catch (e) { console.log("::error::FIREBASE_SERVICE_ACCOUNT non è un JSON valido: incolla TUTTO il contenuto del file scaricato, da { a }."); process.exit(1); }
            if (j.type !== "service_account" || !j.private_key || !j.client_email) {
              console.log("::error::FIREBASE_SERVICE_ACCOUNT non è una chiave di account di servizio (manca type/private_key/client_email).");
              process.exit(1);
            }
            if (j.project_id !== process.env.PROJECT) {
              console.log("::error::La chiave appartiene al progetto " + j.project_id + ", non a " + process.env.PROJECT + ".");
              process.exit(1);
            }
            console.log("Chiave valida per " + j.client_email);
          ' "$RUNNER_TEMP/sa.json"

      # Le funzioni (Stripe/Gemini) si attivano solo quando i relativi valori sono configurati
      - name: Decidi cosa pubblicare
        run: |
          # Errori di copia frequenti: la chiave pubblicabile (pk_) al posto di quella segreta (sk_), o il segreto sbagliato per il webhook.
          # Con valori sbagliati le funzioni non si pubblicano (si pubblicano sito e regole) e il deploy finisce rosso con il motivo.
          BAD=""
          if [ -n "$STRIPE_SECRET_KEY" ]; then
            case "$STRIPE_SECRET_KEY" in
              sk_live_*|sk_test_*|rk_live_*|rk_test_*) ;;
              *) echo "::error::STRIPE_SECRET_KEY non è una chiave segreta di Stripe (inizia con ${STRIPE_SECRET_KEY:0:3}...). Serve la «Chiave segreta» che inizia con sk_live_ (Stripe → Sviluppatori → Chiavi API), non la chiave «pubblicabile» (pk_)."; BAD=1;;
            esac
          fi
          if [ -n "$STRIPE_WEBHOOK_SECRET" ]; then
            case "$STRIPE_WEBHOOK_SECRET" in
              whsec_*) ;;
              *) echo "::error::STRIPE_WEBHOOK_SECRET non è un segreto di webhook (deve iniziare con whsec_)."; BAD=1;;
            esac
          fi
          if [ -n "$BAD" ]; then echo "CONFIG_ERROR=1" >> "$GITHUB_ENV"; fi
          if [ -z "$BAD" ] && [ -n "$STRIPE_SECRET_KEY" ] && [ -n "$STRIPE_WEBHOOK_SECRET" ] && [ -n "$GEMINI_API_KEY" ] \
             && [ -n "${{ vars.PRICE_SMART }}" ] && [ -n "${{ vars.PRICE_PRO }}" ] \
             && [ -n "${{ vars.PRICE_SMART_YEAR }}" ] && [ -n "${{ vars.PRICE_PRO_YEAR }}" ] && [ -n "${{ vars.APP_URL }}" ]; then
            echo "TARGETS=hosting,firestore,functions" >> "$GITHUB_ENV"
            echo "WITH_FUNCTIONS=1" >> "$GITHUB_ENV"
          else
            echo "TARGETS=hosting,firestore" >> "$GITHUB_ENV"
            echo "::warning::Stripe/Gemini non ancora configurati: pubblico solo sito e regole di sicurezza."
          fi

      - name: Prepara le funzioni
        if: env.WITH_FUNCTIONS == '1'
        run: |
          npm ci --prefix functions
          {
            echo "PRICE_SMART=${{ vars.PRICE_SMART }}"
            echo "PRICE_PRO=${{ vars.PRICE_PRO }}"
            echo "PRICE_SMART_YEAR=${{ vars.PRICE_SMART_YEAR }}"
            echo "PRICE_PRO_YEAR=${{ vars.PRICE_PRO_YEAR }}"
            echo "ADMIN_EMAILS=${{ vars.ADMIN_EMAILS }}"
            echo "APP_URL=${{ vars.APP_URL }}"
            # Indirizzo del sito ufficiale (inviti ai familiari): va scritto sempre, anche per quello predefinito
            echo "SITE_URL=${{ vars.SITE_URL || 'https://che-cucino-oggi.web.app' }}"
          } > functions/.env
          for NAME in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET GEMINI_API_KEY; do
            printf '%s' "${!NAME}" | npx --yes firebase-tools@14 functions:secrets:set "$NAME" --data-file - --force --project "$PROJECT"
          done

      - name: Deploy
        run: npx --yes firebase-tools@14 deploy --only "$TARGETS" --force --project "$PROJECT"

      # Gli inviti ai familiari usano indirizzi pubblici (senza accesso): dopo la pubblicazione si controlla che rispondano
      - name: Verifica le funzioni pubbliche degli inviti
        if: env.WITH_FUNCTIONS == '1'
        run: |
          BASE="https://europe-west1-$PROJECT.cloudfunctions.net"
          FAKE="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          for FN in getMemberInvite submitMemberInvite; do
            CODE=$(curl -s -o "$RUNNER_TEMP/out.json" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d "{\"t\":\"$FAKE\",\"consent\":true}" "$BASE/$FN")
            echo "$FN con un link falso: HTTP $CODE $(cat "$RUNNER_TEMP/out.json")"
            [ "$CODE" = "404" ] || { echo "::error::$FN doveva rispondere 404 a un link falso"; exit 1; }
          done
          curl -s -o /dev/null -D "$RUNNER_TEMP/cors.txt" -X OPTIONS -H 'Origin: https://che-cucino-oggi.web.app' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' "$BASE/getMemberInvite"
          grep -i 'access-control-allow-origin' "$RUNNER_TEMP/cors.txt" || { echo "::error::Mancano le intestazioni CORS: la pagina dell'invito non potrebbe collegarsi"; exit 1; }
          # Menù condiviso: un codice falso non deve aprire nulla, e la pagina pubblica deve poter chiamare la funzione
          CODE=$(curl -s -o "$RUNNER_TEMP/out.json" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"code":"AAAA-AAAA-AAAA"}' "$BASE/getSharedMenu")
          echo "getSharedMenu con un codice falso: HTTP $CODE $(cat "$RUNNER_TEMP/out.json")"
          [ "$CODE" = "404" ] || { echo "::error::getSharedMenu doveva rispondere 404 a un codice falso"; exit 1; }
          curl -s -o /dev/null -D "$RUNNER_TEMP/cors2.txt" -X OPTIONS -H 'Origin: https://che-cucino-oggi.web.app' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' "$BASE/getSharedMenu"
          grep -i 'access-control-allow-origin' "$RUNNER_TEMP/cors2.txt" || { echo "::error::Mancano le intestazioni CORS: la pagina del menù condiviso non potrebbe collegarsi"; exit 1; }
          # Volantino da link: senza accesso la funzione deve rifiutare (e quindi esistere)
          CODE=$(curl -s -o "$RUNNER_TEMP/out.json" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"data":{"url":"https://example.com/v.pdf"}}' "$BASE/analyzeFlyerUrl")
          echo "analyzeFlyerUrl senza accesso: HTTP $CODE"
          [ "$CODE" = "401" ] || { echo "::error::analyzeFlyerUrl doveva rispondere 401 senza accesso"; exit 1; }
          # Scontrini: senza accesso la funzione deve rifiutare (e quindi esistere)
          CODE=$(curl -s -o "$RUNNER_TEMP/out.json" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"data":{"data":"x","mimeType":"image/jpeg"}}' "$BASE/analyzeReceipt")
          echo "analyzeReceipt senza accesso: HTTP $CODE"
          [ "$CODE" = "401" ] || { echo "::error::analyzeReceipt doveva rispondere 401 senza accesso"; exit 1; }
          echo "Funzioni degli inviti e del menù condiviso raggiungibili e protette"

      # Se un valore di Stripe era sbagliato, sito e regole sono stati pubblicati ma le funzioni no: il deploy resta rosso finché non si corregge
      - name: Segnala la configurazione sbagliata
        if: env.CONFIG_ERROR == '1'
        run: |
          echo "::error::Funzioni NON pubblicate: correggi i secret di Stripe (vedi gli errori sopra) e rilancia."
          exit 1
